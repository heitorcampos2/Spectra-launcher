name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug + release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Prepare APKs
        run: |
          V="3.1.${GITHUB_RUN_NUMBER}"
          echo "V=$V" >> $GITHUB_ENV
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/SpectraLauncher.apk
          cp app/build/outputs/apk/debug/*.apk   out/SpectraLauncher-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SpectraLauncher-apk
          path: out/*.apk

      # Página de download fixa:
      #   https://github.com/<usuário>/<repo>/releases/latest/download/SpectraLauncher.apk
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$V"
          gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
          MSG=$(git log -1 --pretty=%s)
          gh release create "$TAG" out/SpectraLauncher.apk out/SpectraLauncher-debug.apk \
            --title "Spectra Launcher $V" --latest \
            --notes "$(printf '%s\n\n**Baixar:** SpectraLauncher.apk (instale este na TV e no celular).\nSpectraLauncher-debug.apk é a versão de testes (app separado).' "$MSG")"

      # Cópia dos APKs no branch 'builds' (sempre só o último build)
      - name: Atualizar branch builds
        run: |
          cd out
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add *.apk
          git commit -qm "APK $V (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds

  # Teste rápido num emulador de Android TV: instala, abre as telas e tira prints.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SpectraLauncher-apk
          path: apk
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/smoke.sh
      - name: Publicar prints no branch smoke
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b smoke
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "smoke ${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" smoke

  # Teste do "Controle completo do sistema": ADB local + teclas em OUTRO app (Configurações do Android)
  adb-test:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SpectraLauncher-apk
          path: apk
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/adb-test.sh
      - name: Publicar resultado no branch smoke-adb
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b smoke-adb
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "adb ${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" smoke-adb
