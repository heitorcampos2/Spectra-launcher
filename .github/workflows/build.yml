name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug + release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Rename APKs
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk   out/SpectraLauncher-v$V-debug.apk
          cp app/build/outputs/apk/release/*.apk out/SpectraLauncher-v$V.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SpectraLauncher-apk
          path: out/*.apk
